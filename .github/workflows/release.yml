name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            runtime: win-x64
            extension: .exe
          - name: Linux x64
            os: ubuntu-latest
            runtime: linux-x64
            extension: ''
          - name: macOS x64
            os: macos-latest
            runtime: osx-x64
            extension: ''
          - name: macOS ARM64
            os: macos-latest
            runtime: osx-arm64
            extension: ''
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Publish
      run: |
        dotnet publish -c Release -r ${{ matrix.config.runtime }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        
    - name: Create release archive (Windows)
      if: matrix.config.os == 'windows-latest'
      run: |
        cd bin/Release/net10.0/${{ matrix.config.runtime }}/publish
        7z a ../../../../../BatchCompress-${{ matrix.config.runtime }}.zip *
        
    - name: Create release archive (Unix)
      if: matrix.config.os != 'windows-latest'
      run: |
        cd bin/Release/net10.0/${{ matrix.config.runtime }}/publish
        tar -czf ../../../../../BatchCompress-${{ matrix.config.runtime }}.tar.gz *
        
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BatchCompress-${{ matrix.config.runtime }}
        path: |
          BatchCompress-${{ matrix.config.runtime }}.zip
          BatchCompress-${{ matrix.config.runtime }}.tar.gz
        retention-days: 30
        
  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          BatchCompress-*/BatchCompress-*.zip
          BatchCompress-*/BatchCompress-*.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
